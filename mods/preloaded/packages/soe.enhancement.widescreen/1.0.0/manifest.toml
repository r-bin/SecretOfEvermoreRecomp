format_version = 1
id = "soe.enhancement.widescreen"
version = "1.0.0"
name = "Widescreen"
author = "r-bin"
description = "Shows more of each room to the sides. Widescreen changes only the picture: the game runs exactly as in 4:3. Whole room alive is a separate experiment that changes the game. Menus and other screens stay 4:3."
license = "MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "secretofevermore-usa"
rom_sha256 = "17c864a76d498feb6479eee8e7d6807b951c66225033228622bb66754baab1db"

[[feature]]
id = "widescreen"
name = "Widescreen"
description = "The room's map to the sides, and optionally the characters the game keeps in memory there. Presentation only: the game runs exactly as in 4:3 (src/soe_widescreen.c, src/soe_ws_sprites.c)."
group = "Display"
default_enabled = false
presentation_only = true

[[feature]]
id = "alive"
name = "Whole room alive (experimental)"
description = "Every enemy and character keeps moving wherever it is, at full speed (their logic gets extra time the SNES never had). Spawners fill the room as it loads where it is not crowded, then work as in vanilla but not while your 4:3 view is crowded; enemies outside the 4:3 view only come for you while it holds fewer than a set number of characters. Changes the game: battles and timings differ. Made for Widescreen with characters in the margins, where enemies still to come show as shadows (src/soe_ws_alive.c)."
group = "Display"
default_enabled = false

[[option]]
feature = "widescreen"
id = "aspect"
label = "View aspect ratio"
description = "Adaptive follows the window's shape; the others fix the view. Pixel shape comes from Settings > Display Aspect."
type = "choice"
default = "adaptive"
[[option.choice]]
value = "adaptive"
label = "Adaptive"
[[option.choice]]
value = "16:10"
label = "16:10"
[[option.choice]]
value = "16:9"
label = "16:9"
[[option.choice]]
value = "21:9"
label = "21:9"
[[option.choice]]
value = "32:9"
label = "32:9"

[[option]]
feature = "widescreen"
id = "characters"
label = "Characters in the margins"
description = "None draws sprites only where the game does, so characters appear at the old screen edge. Colour and Greyscale also draw the characters, projectiles and spawn points the game keeps in memory; Greyscale marks them as not drawn by the game."
type = "choice"
default = "colour"
[[option.choice]]
value = "none"
label = "None (as the game draws them)"
[[option.choice]]
value = "colour"
label = "Colour"
[[option.choice]]
value = "grey"
label = "Greyscale"

[[option]]
feature = "widescreen"
id = "edges"
label = "Room edges"
description = "Camera limits shows only the part of the map the game shows (one hut of a hut map); Whole room shows everything the room's map holds."
type = "choice"
default = "limits"
[[option.choice]]
value = "limits"
label = "Camera limits"
[[option.choice]]
value = "room"
label = "Whole room"

[[option]]
feature = "widescreen"
id = "foreground"
label = "Foreground (canopy, roofs)"
description = "Camera limits stops the foreground layer at the area the game can show, also when Room edges shows the whole room; As far as the terrain draws it wherever the room's map has it."
type = "choice"
default = "limits"
[[option.choice]]
value = "limits"
label = "Camera limits"
[[option.choice]]
value = "terrain"
label = "As far as the terrain"

[[option]]
feature = "alive"
id = "cap"
label = "Crowd in the 4:3 view"
description = "Once the old 4:3 view holds this many characters (the Boy and the Dog included; the game's own limit is 6), enemies outside it do not come for you. Those inside fight as usual."
type = "integer"
min = 3
max = 30
step = 1
default = 6

[[option]]
feature = "alive"
id = "count"
label = "Count"
description = "Everyone counts every character in the 4:3 view, as the game's limit does; Enemies only leaves the Boy, the Dog and friendly characters out."
type = "choice"
default = "all"
[[option.choice]]
value = "all"
label = "Everyone"
[[option.choice]]
value = "enemies"
label = "Enemies only"

[[plugin]]
feature = "widescreen"
id = "soe.widescreen"

[[plugin]]
feature = "alive"
id = "soe.widescreen.alive"
